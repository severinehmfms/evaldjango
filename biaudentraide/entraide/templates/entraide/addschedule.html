{% extends "base.html" %}

{% load static %}

{% block title %}Ajout d'un créneau {% endblock %}

{% block header %}
    <img src="{% static 'images/banner-header.jpg' %}" alt="Bannière du site" height="50">
{% endblock %}

{% block main %}
    <h1>Ajouter un créneau</h1>

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Valider</button>

    </form>

    <p>
        <a href="{% url 'entraide:index' %}">
            Retour à la page d'accueil
        </a>
    </p>

{% endblock %}
