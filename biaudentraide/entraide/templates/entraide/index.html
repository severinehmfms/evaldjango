{% extends "base.html" %}

{% load static %}

{% block title %} Liste des compétences proposées {% endblock %}


{% block main %}

    {% if skill_list %}
        <ul>
        {% for skill in skill_list %}
            <li>{{ skill.name_skill }}
            </li>
        {% endfor %}
        </ul>
    {% else %}
        <p>No skill are available.</p>
    {% endif %}

{% endblock %}
